[workspace]
resolver = "3"
members = [
    "apps/api",
    "apps/worker",
    "apps/mcp",
    "crates/domain",
    "crates/runtime",
    "crates/storage",
    "crates/embeddings",
    "crates/services",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
ownstate-domain = { path = "crates/domain" }
ownstate-runtime = { path = "crates/runtime" }
ownstate-storage = { path = "crates/storage" }
ownstate-embeddings = { path = "crates/embeddings" }
ownstate-services = { path = "crates/services" }

anyhow = "1"
async-trait = "0.1"
axum = "0.8"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
fastembed = "6"
pgvector = { version = "0.4", features = ["sqlx"] }
rmcp = { version = "3.2", features = ["transport-io", "schemars"] }
schemars = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "derive",
    "macros",
    "uuid",
    "chrono",
    "json",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 1
