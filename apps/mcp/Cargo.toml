[package]
name = "ownstate-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["fastembed"]
fastembed = ["ownstate-runtime/fastembed"]

[dependencies]
ownstate-domain = { workspace = true }
ownstate-runtime = { workspace = true }
ownstate-services = { workspace = true }

chrono = { workspace = true }
dotenvy = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }
ownstate-embeddings = { workspace = true }
ownstate-storage = { workspace = true, features = ["test-support"] }
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }

[lints]
workspace = true
